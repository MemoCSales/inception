services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    secrets:
      - mcruz-sa_cert
      - mcruz-sa_key
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    restart: always
  
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    ports:
      - "3306:3306"
    secrets:
      - db_root_password
      - db_user_password
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/db_user_password
      - MYSQL_DB=${MYSQL_DB}
      - MYSQL_USER=${MYSQL_USER}
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "3306"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/wordpress
    env_file:
      - .env
    networks:
      - inception
    restart:
      always
  

secrets:
  mcruz-sa_cert:
    file: ./requirements/nginx/ssl/mcruz-sa.42.fr.crt
  mcruz-sa_key:
    file: ./requirements/nginx/ssl/mcruz-sa.42.fr.key
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_user_password:
    file: ./secrets/db_user_password.txt

volumes:
  db-data:
    name: mariadb
  wordpress:
    name: wordpress

networks:
  inception:
    name: inception